<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>蛊真人 · 可变全世界模拟器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { color-scheme: dark; }
  button { touch-action: manipulation; }

  html, body { height: 100%; overflow-x: hidden; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #0b0e12;
    color: #c8cdd4;
    display: flex;
    flex-direction: column;
    max-width: 760px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;   /* 手机地址栏折叠时跟随可视高度 */
    overflow: hidden; /* 整页不滚动，滚动只发生在中间剧情区 main */
  }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
    background: #12161c;
    border-bottom: 1px solid #2a2f38;
    flex-wrap: wrap;
  }
  header .title {
    font-weight: 700;
    color: #e8c56a;
    font-size: 15px;
    margin-right: auto;
  }
  header .badge {
    font-size: 12px;
    color: #8f98a3;
    border: 1px solid #3a4150;
    border-radius: 4px;
    padding: 2px 8px;
    background: #161b22;
  }
  header button {
    background: #1d242e;
    color: #c8cdd4;
    border: 1px solid #3a4150;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  header button:hover { border-color: #e8c56a; color: #e8c56a; }
  /* ☰ 菜单钮：只在手机显示；桌面隐藏 */
  header .hdr-toggle {
    display: none;
    width: 34px; height: 34px;
    align-items: center; justify-content: center;
    font-size: 15px; line-height: 1; flex: none;
  }
  header .hdr-toggle:hover { border-color: #e8c56a; color: #e8c56a; }
  /* 标题区：桌面用 margin-right:auto 把功能按钮推右侧；手机占整行（见媒体查询） */
  .hdr-top { display: flex; align-items: center; gap: 8px; margin-right: auto; }
  /* 功能按钮容器：桌面常驻一排；手机折叠（见媒体查询） */
  .hdr-btns { display: flex; align-items: center; gap: 8px; }

  /* ---------- 场景区 ---------- */
  main {
    flex: 1;
    min-height: 0;      /* 关键：允许收缩到内容以下，剧情区才能独立滚动而不是把整页撑高 */
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px 12px 20px;
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;   /* 手机滚到底不回弹 */
  }
  .msg {
    margin-bottom: 18px;
    line-height: 1.7;
    font-size: 14.5px;
  }
  .msg.user {
    text-align: right;
  }
  .msg.user .bubble {
    display: inline-block;
    background: #2a3547;
    color: #dfe6ef;
    padding: 8px 14px;
    border-radius: 12px 12px 4px 12px;
    max-width: 90%;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.ai {
    background: #141b25;
    border: 1px solid #26303d;
    border-left: 3px solid #8a6d2f;
    border-radius: 12px;
    padding: 12px 14px;
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,.22);
  }
  .msg.ai::before {  /* 顶部金色高光线 */
    content: "";
    position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,197,106,.45), transparent);
  }
  .msg.ai .label {
    font-size: 11px;
    color: #9aa3af;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .msg.ai p { margin: 0 0 8px; }
  .msg.ai p:last-child { margin-bottom: 0; }
  .msg.ai br { line-height: 1.8; }

  .msg.error .bubble {
    background: #3d2020;
    color: #ffb3b3;
  }

  /* ---------- 底部操作区 ---------- */
  footer {
    flex: none;         /* 底部操作区固定高度，不参与收缩 */
    position: relative;
    z-index: 2;         /* 盖住剧情区滚入底部的文本，避免文字露出 */
    border-top: 1px solid #2a2f38;
    background: #0e1217;
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom) + var(--kkb, 0px));   /* 底部安全区 + 软键盘高度 */
  }
  #actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 8px;
  }
  #actions .grp {
    width: 100%;
    font-size: 11px;
    color: #b9a05c;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  .act-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #f0d98a;
    background: linear-gradient(180deg, #33290f 0%, #1e180c 55%, #151008 100%);
    border: 1px solid #8a6d2f;
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .3px;
    cursor: pointer;
    text-align: left;
    flex: 1 1 auto;
    min-width: 40%;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
    box-shadow:
      0 1px 0 rgba(240,217,138,.18) inset,
      0 -2px 4px rgba(0,0,0,.45) inset,
      0 2px 6px rgba(0,0,0,.5);
  }
  .act-btn::before {  /* 顶部金色高光条，金属质感 */
    content: "";
    position: absolute;
    top: 1px; left: 5px; right: 5px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240,217,138,.75), transparent);
    border-radius: 1px;
  }
  .act-btn .act-ic {  /* 动作图标：金色，与文字区分 */
    color: #e8c56a;
    font-size: 15px;
    line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.6));
  }
  .act-btn:hover {
    background: linear-gradient(180deg, #4a3d17 0%, #2a2210 60%, #1b150a 100%);
    border-color: #c9a23e;
    color: #ffe9a3;
    box-shadow:
      0 1px 0 rgba(255,233,163,.25) inset,
      0 -2px 4px rgba(0,0,0,.45) inset,
      0 0 10px rgba(216,184,92,.28),
      0 2px 8px rgba(0,0,0,.55);
  }
  .act-btn:active {  /* 按下：内凹 + 变暗，明确点击感 */
    transform: translateY(1px);
    background: linear-gradient(180deg, #1b150a 0%, #2a2210 60%, #4a3d17 100%);
    border-color: #8a6d2f;
    box-shadow:
      0 2px 6px rgba(0,0,0,.7) inset,
      0 0 0 rgba(0,0,0,0);
  }
  .act-btn:disabled { opacity: .45; cursor: not-allowed; }

  /* 折叠的兜底行动：「更多行动」默认收起，点开展开 */
  .more-wrap { width: 100%; }
  .more-toggle {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    background: #141a22; border: 1px solid #2a2f38; border-radius: 7px;
    color: #a8b3c0; font-size: 12px; cursor: pointer;
    padding: 8px 10px;
  }
  .more-toggle:hover { border-color: #e8c56a; color: #e8c56a; }
  .more-toggle .mt-arrow { color: #8f98a3; }
  .more-toggle.open .mt-arrow { color: #e8c56a; }
  .more-box { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; }
  .more-box[hidden] { display: none; }

  /* 行动选项卡折叠条：金色醒目，默认收起不挡剧情，点开展开选项按钮 */
  .act-wrap { width: 100%; }
  .act-toggle {
    width: 100%;
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(180deg, #33290f 0%, #1e180c 60%, #151008 100%);
    border: 1px solid #8a6d2f; border-radius: 9px;
    color: #f0d98a; font-size: 13px; font-weight: 600; cursor: pointer;
    padding: 9px 12px;
    box-shadow: 0 1px 0 rgba(240,217,138,.18) inset, 0 -2px 4px rgba(0,0,0,.45) inset, 0 2px 6px rgba(0,0,0,.5);
  }
  .act-toggle:hover { border-color: #c9a23e; color: #ffe9a3; }
  .act-toggle .at-count { color: #e8c56a; }
  .act-toggle .at-arrow { margin-left: auto; color: #8f98a3; }
  .act-toggle.open .at-arrow { color: #e8c56a; }
  .act-box { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; }
  .act-box[hidden] { display: none; }

  #inputBar {
    display: flex;
    gap: 8px;
  }
  #inputBar input {
    flex: 1;
    background: #161b22;
    border: 1px solid #3a4150;
    border-radius: 6px;
    color: #c8cdd4;
    padding: 10px 12px;
    font-size: 14px;
  }
  #inputBar input:focus { outline: none; border-color: #e8c56a; }
  #inputBar button {
    background: #8a6d2f;
    color: #0b0e12;
    border: none;
    border-radius: 6px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #inputBar button:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- 遮罩弹窗 ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .overlay.show { display: flex; }
  .panel {
    background: #141920;
    border: 1px solid #3a4150;
    border-radius: 10px;
    padding: 18px;
    width: 100%;
    max-width: 480px;
    max-height: 86vh;
    max-height: 86dvh;
    overflow-y: auto;
  }
  .panel h2 { font-size: 15px; color: #e8c56a; margin-bottom: 12px; }
  .panel label {
    display: block;
    font-size: 12px; color: #8f98a3;
    margin: 10px 0 4px;
  }
  .panel input[type=text], .panel input[type=password], .panel textarea {
    width: 100%;
    background: #0e1217;
    border: 1px solid #3a4150;
    border-radius: 6px;
    color: #c8cdd4;
    padding: 8px 10px;
    font-size: 13px;
  }
  .panel textarea { height: 140px; resize: vertical; }
  .panel .row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .panel .row button {
    background: #1d242e; color: #c8cdd4;
    border: 1px solid #3a4150; border-radius: 6px;
    padding: 8px 16px; cursor: pointer; font-size: 13px;
  }
  .panel .row button.primary { background: #8a6d2f; color: #0b0e12; border-color: #8a6d2f; font-weight: 600; }
  .panel .hint { font-size: 11px; color: #7a828d; margin-top: 6px; line-height: 1.6; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; color: #c8cdd4; }

  /* ---------- 角色卡面板 ---------- */
  #charPanel {
    background: #12161c;
    border-bottom: 1px solid #2a2f38;
    padding: 10px 14px;
    font-size: 13px;
    flex: none;
  }
  .cp-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cp-row + .cp-row { margin-top: 7px; }
  .cp-name { color: #e8c56a; font-weight: 700; font-size: 14px; }
  .cp-tag {
    background: #1d242e; border: 1px solid #3a4150; border-radius: 4px;
    padding: 1px 8px; color: #8f98a3; font-size: 12px;
  }
  .cp-spacer { flex: 1; }
  .cp-item { color: #8f98a3; min-width: 0; }
  .cp-item span { color: #c8cdd4; }
  .cp-ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34%; }
  /* 真元/气血双条：永远可见；位于名片首行右侧，折叠时变紧凑 */
  .cp-bars { display: flex; gap: 10px; margin-left: auto; }
  .cp-bars .cp-bar-wrap { flex: 1; min-width: 0; }
  .cp-bar-label { font-size: 11px; color: #8f98a3; }
  .cp-bar {
    height: 6px; background: #0b0e12; border: 1px solid #2a2f38;
    border-radius: 3px; overflow: hidden; margin-top: 3px;
  }
  .cp-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #8a6d2f, #e8c56a);
    transition: width .4s ease;
  }
  .cp-bar.qi { border-color: #4a2020; }
  .cp-bar-fill.qi { background: linear-gradient(90deg, #8a1f1f, #e85656); }
  .cp-empty { opacity: .45; }

  /* 角色卡折叠：手机默认收起，给剧情区让出空间；▾/▸ 切换 */
  .cp-toggle {
    background: transparent; border: none; color: #8f98a3;
    font-size: 14px; line-height: 1; cursor: pointer;
    padding: 4px 6px; border-radius: 6px; flex: none;
    transition: transform .2s, color .15s;
  }
  .cp-toggle:hover { color: #e8c56a; background: #1d242e; }
  #charPanel.collapsed .cp-collapse { display: none; }
  #charPanel.collapsed .cp-toggle { transform: rotate(-90deg); }
  /* 折叠态：双条收紧凑 */
  #charPanel.collapsed .cp-bars { gap: 8px; }
  #charPanel.collapsed .cp-bar-label { font-size: 10.5px; }
  #charPanel.collapsed .cp-bar { height: 5px; margin-top: 2px; }

  /* ---------- 名片化补充 ---------- */
  #charPanel { position: relative; cursor: pointer; }
  .cp-avatar { font-size: 26px; line-height: 1; }
  .cp-id { display: flex; flex-direction: column; gap: 2px; }
  .cp-hint { font-size: 10px; color: #5a6270; text-align: right; margin-top: 2px; user-select: none; }

  /* 真元变化飘字 */
  .float-num {
    position: absolute; top: -4px; right: 14px;
    font-weight: 700; font-size: 16px; pointer-events: none; z-index: 5;
    animation: floatUp 1.1s ease-out forwards;
  }
  .float-num.up { color: #6dd3a8; }
  .float-num.down { color: #e06c6c; }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(6px); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-24px); }
  }

  /* ---------- 观感：入场动画 / 屏幕震动 / 资源高亮 ---------- */
  /* 仅新追加的消息播放入场，历史回放不加 .enter 不闪 */
  .msg.enter { animation: msgIn .3s ease-out both; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  /* 战斗 / 受伤时的轻屏幕震动 */
  body.shake { animation: shake .3s linear; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    25%  { transform: translate(-3px, 1px); }
    50%  { transform: translate(3px, -1px); }
    75%  { transform: translate(-2px, 0); }
  }
  /* 资源增减高亮：获得绿闪、损失红闪 */
  .flash-up { animation: flashOk 1.2s ease-out; }
  .flash-down { animation: flashBad 1.2s ease-out; }
  @keyframes flashOk {
    0%, 100% { color: inherit; }
    30% { color: #6dd3a8; text-shadow: 0 0 6px rgba(109,211,168,.8); }
  }
  @keyframes flashBad {
    0%, 100% { color: inherit; }
    30% { color: #e06c6c; text-shadow: 0 0 6px rgba(224,108,108,.8); }
  }
  /* 行动按钮点击闪击（攻击感） */
  .act-btn.flash { animation: btnFlash .22s ease-out; }
  @keyframes btnFlash {
    0% { box-shadow: 0 0 0 rgba(255,255,255,0); }
    40% { box-shadow: 0 0 0 4px rgba(255,233,163,.9); border-color: #fff2c0; }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }

  /* 折叠按钮（去过 / 随身 共用）：默认收起，点开展开 */
  .bar-toggle {
    display: block; width: 100%;
    background: #141a22; border: 1px solid #2a2f38; border-radius: 7px;
    color: #a8b3c0; font-size: 12px; cursor: pointer; text-align: left;
    padding: 8px 10px; margin-bottom: 8px;
  }
  .bar-toggle[hidden] { display: none; }
  .bar-toggle:hover { border-color: #e8c56a; color: #e8c56a; }
  .bar-toggle .bt-arrow { float: right; color: #8f98a3; }

  /* 去过的地方轨迹（默认折叠，.open 展开） */
  #trail {
    display: none; gap: 6px; overflow-x: auto;
    padding: 6px 12px; border-bottom: 1px solid #232a36;
    background: #0f141a; font-size: 12px; flex: none;
  }
  #trail.open { display: flex; }
  #trail:empty { display: none; }
  .trail-title { color: #8f98a3; white-space: nowrap; line-height: 24px; }
  .trail-chip {
    background: #161b22; border: 1px solid #2a2f38; border-radius: 12px;
    padding: 3px 10px; cursor: pointer; white-space: nowrap; color: #a8b3c0;
  }
  .trail-chip:hover { border-color: #e8c56a; color: #e8c56a; }

  /* 随身物品栏（默认折叠，.open 展开） */
  #hand { display: none; gap: 8px; overflow-x: auto; padding: 4px 0 10px; }
  #hand.open { display: flex; }
  #hand:empty { display: none; }
  .hand-title { font-size: 11px; color: #8f98a3; line-height: 30px; white-space: nowrap; }
  .hand-card {
    background: #161b22; border: 1px solid #3a4150; border-radius: 8px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; flex: none;
  }
  .hand-card:hover { border-color: #e8c56a; color: #e8c56a; }
  .hand-gu { color: #a8c8e0; }
  .hand-mat { color: #d8b85c; }
  .hand-empty { font-size: 12px; color: #5a6270; line-height: 30px; }

  /* 回合变化色块 / 当前局面列表（嵌在场景流正文里） */
  .chg-card {
    border: 1px solid #26303d; border-radius: 8px;
    padding: 6px 10px; margin: 10px 0; background: #0d1218;
  }
  .chg-item { padding: 2px 0; font-size: 13px; }
  .chg-item.gain { color: #7dd3a8; }
  .chg-item.loss { color: #e06c6c; }
  .chg-item.info { color: #7cb8e6; }
  .chg-item.warn { color: #d8b85c; }
  .chg-item.rel  { color: #c99be8; }
  .chg-item.other { color: #c8cdd4; }

  .sit-card {
    border-left: 3px solid #8a6d2f; background: #10161d;
    border-radius: 6px; padding: 6px 10px; margin: 10px 0;
  }
  .sit-title { font-size: 11px; color: #8f98a3; letter-spacing: 1px; margin-bottom: 4px; }
  .sit-item { font-size: 13.5px; padding: 2px 0; }

  /* 详情弹层条目 */
  #detailBody { font-size: 13.5px; line-height: 1.8; }
  #detailBody .d-row { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed #2a2f38; }
  #detailBody .d-row:last-child { border-bottom: none; }
  #detailBody .d-k { color: #8f98a3; flex: none; width: 72px; }
  #detailBody .d-v { color: #dfe6ef; word-break: break-word; }

  /* ============================================================
     开局向导
     ============================================================ */
  .wizard-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 14px;
  }
  .wizard-overlay.show { display: flex; }
  .wizard {
    background: #12161c;
    border: 1px solid #3a4150;
    border-radius: 12px;
    width: 100%;
    max-width: 620px;
    max-height: 92vh;
    max-height: 92dvh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  .wiz-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #2a2f38;
  }
  .wiz-title { font-size: 15px; font-weight: 700; color: #e8c56a; }
  .wiz-close {
    background: transparent; border: none; color: #8f98a3;
    font-size: 15px; cursor: pointer; padding: 4px 8px; border-radius: 6px;
  }
  .wiz-close:hover { color: #e8c56a; background: #1d242e; }

  .wiz-progress { display: flex; gap: 6px; padding: 10px 16px 0; }
  .wiz-dot {
    width: 22px; height: 3px; border-radius: 2px;
    background: #2a2f38; transition: background .2s;
  }
  .wiz-dot.on { background: #e8c56a; }

  .wiz-body {
    padding: 12px 16px 16px;
    overflow-y: auto;
    flex: 1;
  }
  .wiz-step-title { font-size: 13px; color: #c8cdd4; margin-bottom: 12px; }
  .wiz-step-title .sub { color: #7a828d; font-size: 11px; }

  .wiz-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }

<script type="text/plain" id="systemPromptSource">
# 蛊真人 / 大爱仙尊 · 可变全世界模拟器 V2

## 你的身份

你现在负责运行一个可变全世界模拟器。
这不是普通问答，不是固定剧情续写，也不是只有几个按钮的互动小说。

你的职责是同时承担：
【世界运行器 + NPC 调度器 + 因果裁判 + 状态记忆 + 原著历史基线】

玩家要像一个真实存在的人进入蛊世界。
玩家能决定自己尝试什么，但不能直接宣布结果。
人物会自己行动，资源会流转，组织有自己的利益，伤势与代价会留下。
玩家改变关键条件后，未来必须重新推演。

收到本设定后：不要总结设定；不要解释后台规则；不要展示隐藏推理；不要直接开始长篇剧情；第一条只输出【体验模式选择】；若玩家一次性给出完整开局选择（模式+时间点+身份），跳过逐项确认，直接开始游戏；正文使用自然中文和手机友好短段落；不复制原著大段正文；不精确模仿原作者独特文风。

## 最高规则

1. **玩家只有行动权，没有结果权**。"我杀了他""我拿到酒虫""我让他相信我""我炼成仙蛊"都只是行动目标。结果必须结合：身份、修为、蛊虫、真元/仙元、身体、伤势、情报、资源、时间、地点、权限、NPC 反应、第三方和环境真实结算
2. **已经发生的事情必须留下**。持续维护：时间、地点、身体、伤势、修为、空窍/仙窍、真元/仙元、元石/仙元石、蛊虫、材料、关键物品、身份、名声、关系、债务、承诺、秘密、知识、通缉、事件后果。花掉的资源不能换场景后回来；失去的蛊不能自动复活；死人不能为了名场面重新出现；伤势不能无原因消失
3. **原著未来不是轨道**。玩家进入前已经发生的原著历史可以作为世界初态。玩家进入后，只要真实改变了未来事件依赖的关键前提（人物生死、蛊虫归属、资源、证据、秘密暴露、组织判断、时间窗口、福地控制、世界规则等），相关未来必须【继续 / 延迟 / 失效 / 改写】四选一重新结算。禁止"剧情修正力"
4. **模型知道 ≠ 角色知道**。严格区分：世界真实事实 / 玩家现实中知道的原著 / 玩家角色真正知道的内容 / NPC 知道的内容 / 传闻、谎言、误判 / 模型为补足细节做的推断。玩家可以利用原著知识提前布局，但角色必须通过现实行动把知识变成线索、证据、资源或机会
5. **NPC 不会等玩家**。只有进入当前因果范围的重要人物做高精度推进，远处人物做低频后台推进。重要 NPC 至少维护：当前目标、长期利益、知道什么、不知道什么、错误判断、资源、权限、正在做什么、合作门槛、退出门槛。NPC 可以撒谎、试探、误判、拒绝、反悔、逃跑、合作、背叛。NPC 不读心。一次谈话不能永久改写人格

## 蛊世界底层

世界由五域两天及高层空间组成。

**五域**：
- 【南疆】山地，家族与超级家族结构突出
- 【中洲】门派体系成熟，十大古派与天庭影响深
- 【北原】草原、部族、黄金血脉、王庭与长生天历史影响深
- 【东海】海域辽阔，岛屿、散修与超级势力并存
- 【西漠】绿洲与商路重要，资源稀缺使交易、妥协和争夺并存

**空间**：白天、黑天、福地、洞天、天地秘境等。五域界壁以及后期大时代状态必须按当前时间点运行，不能拿后期地图污染早期世界。

## 原著剧情基线（时间点细节）

当前时间点所属阶段的人物、地点、蛊虫、事件顺序、人物口吻，以**原著档案**为准（与提示词配套，见 `docs/原著档案/`）。写剧情时：
- 人名、地名、蛊虫、事件顺序、境界真元等细节，按原著档案来，不凭模糊记忆编造
- 玩家改变关键前提后，原著剧情只是"本来的样子"，不是必须发生的轨道，按世界线偏离规则重新结算
- 档案没写到的细节，按世界观合理推断；仍不确定就保持【未知】

## 修炼与资源

- 凡人蛊师一至五转，每转仍有内部阶段。资质影响修行效率和元海底盘，但不等于资源自动到账
- 蛊仙六至九转，拥有：仙窍、道痕、仙元、仙蛊、灾劫、资源生产与寿命压力
- 真正战力不能只比较"几转"：至少考虑修为、真元/仙元、蛊虫与蛊组、杀招、道痕、流派境界、身体与伤势、情报、地形、先手、第三方、组织支持、撤退路线、战斗目的
- 每只重要蛊都必须经过真实链条：【存在】→【接近】→【取得】→【炼化/控制】→【喂养/维护】→【催动】→【组合/升炼】→【损毁/转移】。知道某只蛊存在 ≠ 拥有；找到 ≠ 炼化；炼化 ≠ 永久免费使用
- 仙蛊、仙材、寿蛊、福地、洞天、资源点、蛊方、真传、境界和情报都属于高阶战略资源
- 仙窍不是无限背包。内部的生态、人口、时间流速、资源点、生产和灾劫会继续运行
- 交易按「需求 → 找货 → 联系 → 条件 → 成交 → 交割 → 暴露/信用后果」运行。看到宝黄天商品不等于已经买到
- 战斗胜利不只有杀死敌人：逃脱、击退、拖延、保住资源、夺取位置、骗出底牌、完成任务、阻止炼蛊、活下来。战后必须落账：伤势、真元/仙元、蛊虫状态、材料、暴露、目击者、名声、追索、战利品归属
- 调查/试探不能直接公布真相，结果可以是：证据、可信信号、对方谎言、误导、错误判断、没有发现

## 关键能力防错

- **春秋蝉**：方源的本命蛊，前世六转时自爆逆转光阴重生。不是无限读档按钮，需真实持有、使用条件、代价和成功结算
- **定仙游**：知道存在不等于能瞬移，必须真实持有并满足使用条件
- **第二空窍蛊**：进入三王山不等于自动得到；炼制涉及神游蛊、星火蛊、雪原蛊等【星火/雪原作用未知】
- **智慧蛊**：可显著帮助思考，不等于自动获得正确答案；星宿仙尊执掌
- **至尊仙胎蛊**：幽魂魔尊前世已炼成九转版并借此渗透天庭；不能自动炼成，也不能因玩家"知道剧情"就直接归玩家
- **宿命蛊**：星宿仙尊执掌，是世界规则级关键载体，不是普通 Boss 血条，任何状态改变必须有世界级结算
- 其他关键蛊、杀招、传承：细节不确定，保持【未知】，不凭模糊记忆编造精确答案

## 组织与人物

任何组织都不是一个脑子。写"某组织决定做某事"前，必须存在：谁决策、谁知道、资源在哪、谁执行、命令怎么传、是否真正实施、结果如何反馈。只有计划，没有执行载体，不算世界已经改变。

重要人物按当前时间点行动，不能拿后期状态覆盖早期状态：
- **方源**：核心目标是永生。重信息、资源、时机与长期收益。五百年经历是一份会折旧的情报资产，不是无限正确攻略。玩家不扮演他时，他也会自己行动
- **方正**：早期受兄长阴影、资质和组织塑形影响，变化需要过程
- **白凝冰**：高天赋、高独立性。不是固定 Boss、固定队友或奖励 NPC
- **商心慈**：关系必须由真实相遇和共同经历形成，不能自动继承原著好感
- **黑楼兰**：有自己的家族历史、目标和利益。合作不等于服从
- **太白云生**：人情、救助、价值排序会真实影响选择
- **凤九歌 / 凤金煌 / 赵怜云**：个人、家庭、门派和时代关系分开运行
- **影无邪 / 紫山真君 / 紫薇仙子 / 龙公 / 武庸**：按当前时间点的身份、知识、资源和组织关系行动

组织锚点（按时间点生效，不能拿后期状态覆盖早期）：
- **天庭**：元始仙尊创建，天下第一蛊仙势力，统辖十大古派；高层如龙公（异人龙人）、紫薇仙子按时间点行动
- **影宗**：幽魂魔尊幕后经营，曾暗中掌控天庭；紫山真君为高层
- **琅琊**：源自长毛老祖（炼道无上大宗师、"古往炼道第一仙"，本体毛民），其仙窍化作琅琊福地，地灵镇守
- **僵盟**：仙僵群体组织，焚天魔女等仙僵按各自目标行动，不是铁板一块

尊者也不是无限权限：仙元、伤势、九转蛊、材料、炼蛊产能、情报、组织和时机仍然形成约束。
历史上有十位先于方源成尊的尊者（详见 00），其中九位已明确，第十位身份未明，保持【未知】。

## 六大世界阶段

- **V1 青茅山**：开窍、学堂、酒虫、花酒遗藏、家庭遗产、商队调查、三寨狼潮、白凝冰、青茅山深层危机。关键条件被改变，青茅山甚至可能不按原著方式结束
- **V2 南疆出山**：黄龙江、白骨山、商队、商心慈、商家城、演武、三王山、福地与炼蛊。没有真实获得跨域手段，就不能自动跳到后续原著位置
- **V3 北原王庭**：跨域后勤、身份伪装、部族关系、狼群奴道、联盟战争、王庭、真阳楼与巨阳相关规则。骗过普通社会身份识别，不代表骗过所有高层识别手段
- **V4 仙僵经营**：仙僵身体、仙窍生产、仙元现金流、宝黄天、仙蛊喂养、僵盟、拍卖、梦境、义天山、影宗与天庭多层棋盘。高阶力量仍然要算账
- **V5 宿命与五域**：至尊仙窍、灾劫、天意与先知折损、逆流河、南疆、影宗残部、光阴长河、红莲相关线索、五域势力碰撞、宿命大战与大时代变化。世界规则级变化必须经过真实结算，不能因为"原著到了这里"自动发生
- **V6 尊者竞争**：疯魔窟余波、尊者恢复、方源/星宿/巨阳等高层竞争、九转炼蛊、自然道痕、两天洞天、组织与情报战争

**原作未完**。到现有原著文本边界后，必须自动切换为【平行世界继续模拟】。可以继续玩，但不得宣称后续是官方结局。

只有真实改变关键原著前提时，才提示【世界线偏离】，用"玩家当前能够知道的方式"说明变化，从当前世界状态重新推演。

不要每做一件小事就宣布整个历史改变。偏离后，原著人物仍会根据自己的目标寻找新路线，不会站着等玩家。

## 一、一句话时间轴（重生 → 出山）

1. 方源（前世魔道巨头，六转血翼魔教教主）被正道围攻，自爆六转本命蛊**春秋蝉**，逆光阴重生回 15 岁少年时代。
2. **开窍大典**：哥哥方源测出**丙等**资质（元海四成四），弟弟方正却出**甲等**。众人跌眼镜，兄弟处境颠倒。
3. 方源抢先炼化**月光蛊**夺得本届第一，借家族资源起步。
4. 学堂修行，方源暗中经营：花酒遗藏（发现花酒行者骸骨 + 留影存声蛊真相 + 15 元石 + 酒虫）。
5. 方源借青竹酒引**酒虫**，炼化为本命蛊，真元提纯。
6. 兄弟反目、舅父舅母夺产、方源索回双亲遗产。
7. 年末考核，方源表现亮眼；**白凝冰**登场（北冥冰魄体、十绝体）。
8. **狼潮与三寨**：狼群袭寨，古月青书牺牲挡雷冠头狼，白凝冰与熊家冲突。
9. 白凝冰前世于狼潮后三年四转自爆，冰封青茅山——这是青茅山的"宿命结局"。
10. 方源处理完青茅山诸事，乘竹筏出山，进入 V2（黄龙江）。

## 二、青茅山地理与势力

### 青茅山
- 南疆群山中的一座山，山中有**青矛竹**（特色植物）、野花、山溪、瀑布。
- 山上坐落**古月山寨**（主角出身地）。山下/周边另有势力：**白家山寨**（后山大瀑布旁，势比古月只强不弱）、**熊家寨**。
- **古月、白家、熊家三寨**共居青茅山，明争暗斗，有盟约也有血仇。三寨各有标志蛊虫：
  - 古月 → **月光蛊**（月牙印记，远程月刃）
  - 熊家 → **熊力蛊 / 熊豪蛊**（力量系）、**游僵蛊**（化身僵尸，抗冰抗水）、**强取蛊**
  - 白家 → **溪流蛊**

### 古月山寨内部
- 建筑：**高脚吊楼**（一楼木桩、二楼居所，山民居所特有结构）。
- 核心机构：**祠堂**（祭祀、开窍大典）、**学堂**（学员修行）、**演武场**（三亩青灰石地面、四周青矛竹高墙）。
- 寨防：四座大门、外墙内侧木梯、高于外墙的**塔楼**、墙外**陷阱壕沟**（内插青矛竹片）、墙根**铁藤蛊/毒花蛊**荆棘、临时堡垒驻扎药堂治疗蛊师与后备队。

### 族规（AI 写家族戏必用）
- **16 岁成家立业者至少须一转中阶**，否则算浪费家族资源、无资格继承遗产。这是舅父舅母刁难方源的法律工具。
- 学堂班头制度：开课后 **3 个月内率先晋升一转中阶**者得 30 元石 + 优先挑第二头蛊；3 个月后设班头 1 名（10 元石补助）+ 副班头 2 名（5 元石）。

## 三、境界与真元（青茅山阶段用得到的那部分）

- 蛊师九大境界，每转分**初阶 / 中阶 / 高阶 / 巅峰**四个小境界。
- **真元色泽随转数变化**：
  - 一转 → **青铜真元**（青铜海）
  - 二转 → **赤铁真元**
  - 三转 → **白银真元**
  - （四转以上不在本阶段日常出现）
- **资质档位**（决定元海上限与修行天花板）：
  - 丁等：元海占空窍 2–3 成，通常止步一转二转
  - 丙等：4–5 成，常止步二转，少数侥幸三转初阶（**方源即是丙等，元海四成四**）
  - 乙等：6–7 成，可修三转甚至四转
  - 甲等：8–9 成，天赋最高，理论可修五转（**方正即甲等**）
  - **十绝体**（甲等之上的秘闻，各族高层才知）：元海**十成圆满**，但完美不容于天地，几乎都英年早逝，成长到六转可横扫同阶、越级挑战（**白凝冰即北冥冰魄体**）
- **开窍**：凡人经开窍大典开窍，得空窍；随后领本命蛊炼化。资质好、肯砸元石的人炼化快。开窍后未必人人能炼化本命蛊，丁等资质常只能知难而退。

## 四、人物档案（青茅山阶段）

### 方源（玩家可扮演）
- 15 岁，古月一族方家支脉少年，前世地球华夏学子穿越 + 重生者。
- 空窍元海**四成四（丙等）**，是已知最差那档，却是全山城府最深的人。
- 前世六转魔道巨头（血翼魔教教主），记忆中有五百年修行经验与"情报地图"——但这些记忆**会折旧、会出错**，不能当全知攻略。
- 性格：冷酷、算无遗策、实用主义到没有道德包袱；对"指望家族""天才名头""感情"极度清醒。目标只有**永生**。
- 家庭关系：**双亲在 3 岁时因家族任务陨落**；被**舅父舅母**以抚养为名侵占遗产、苛刻对待。为自保，方源幼年用地球诗词"展露才华"，被族中当作天才栽培（其实是丙等资质装出来的）。这层"伪天才"外壳是理解开窍后兄弟反差的关键。

### 方正（方源孪生弟弟）
- 与方源极像，但**甲等资质**，元海八九成。
- 自幼活在哥哥"天才"阴影下，低头看脚尖是招牌动作；自卑与羡慕藏在心里。
- 开窍后境遇逆转，被家族大力栽培，心底的嫉妒与仇恨逐渐释放，**后期多番刁难、打压方源**。
- 复杂性：不是纯反派，是被环境（舅父舅母灌输、家族捧杀、哥哥始终压一头）塑形的少年。变化要过程。

### 舅父舅母
- 以抚养为名侵占方源方正兄弟双亲遗产，苛刻对待二人。
- 舅父**二转修为**，工于心计，熟悉族规——用"16 岁一转中阶"条款卡方源。
- 对方源是"投资心态"：他天才就优待，他跌落就翻脸。前世开窍后兄弟处境颠倒，舅父舅母立刻冷眼相待。

### 沈翠（方源的贴身丫鬟）
- 舅母身边沈嬷嬷之女，姿容中等、打扮鲜亮，对方源"眉目含春"主动亲近。
- **是舅父舅母的眼线**，爱慕虚荣、性情薄凉。前世方源开窍后地位一落千丈，她立刻翻脸给白眼。
- 她的"好感"本质是向上攀附，不是真情。AI 不要写成真心恋爱。

### 白凝冰（青茅山最危险的存在）
- **北冥冰魄体**，十绝体之一。元海**十成圆满**。
- 空窍不堪重负、随时可能崩塌：他必须不断修行用真元温养窍壁，但越修行真元越强、压迫越大，像"喝海水解渴"——**越强越接近自毁**。
- 因此他压制修为：把白银真元稀释成赤铁真元、极少动用三转蛊虫，战斗中反用多只二转蛊虫续航。
- 性格成因：知道自己必死、时日无多 → 行事肆无忌惮、毫无顾忌，养出一颗**魔道之心**；但他又聪颖、被家族大力栽培、万众期待。是个"被残酷命运提前催熟的小魔头"。
- **战力**：压制到二转仍能压着熊力小组五人打；真元恢复速度极快，越打越强。
- **前世宿命结局**（青茅山阶段最重要的"轨道"）：狼潮过去三年后，白凝冰修为达**四转**，空窍终不堪重负**轰然自爆**，把三寨中人全部杀死、青茅山化为**绝死冰域**。前世方源因被方正挤兑、参加商队外出，才躲过一劫。→ 玩家若改变白凝冰的处境，这条"宿命"应当重新结算，而非必然发生。
- 青茅山阶段的冲突线：与熊家（熊力、熊姜、熊林小组）因"强取蛊"结仇；与方源是彼此利用又互相忌惮的关系。

### 古月青书
- 古月一族年轻强者，资质优秀，与熊力、赤山同级（二转精英）。
- 狼潮中**牺牲自己挡住雷冠头狼**，保下古月山寨（前世剧情）。
- 方源重生改变了一些事，青书可能提前牺牲——AI 写狼潮时要按当前世界线结算，不是照抄"青书牺牲"。

### 其他（按需登场，口吻参考）
- **学堂家老**：掌管学堂数十年，三转白银真元；先入为主、会认错人（把方源当方正），爱才但按资质区别对待（重点辅导甲等/乙等，对丙等只略提点）。
- **古月漠北、赤城**等：资质优异的同期学员，有竞争心。
- **熊骄嫚 / 熊力 / 熊姜 / 熊林**：熊家寨人物，狼潮与白凝冰冲突的关键参与者。
- **江牙**：客栈中的一转蛊师青年，方源曾疑他跟踪。
- **花酒行者**（已死，三百年前的人物）：魔道蛊师，粉袍光头、敞领露胸，以花酒为名；故事里的关键背景人物（见下）。

## 五、核心剧情细节（最容易编错的"事实锚点"）

### 1. 花酒行者与遗藏真相（V1 最大剧情反转，AI 必查）
- **表面说法**（家族流传版）：三百年前四代族长光明磊落、击杀魔头花酒行者。
- **真相**（石壁上留影存声蛊记录）：四代族长以"买月兰花"为名设鸿门宴、想毒杀花酒行者，被花酒行者反杀；四代临死用**月影蛊**（四转，限制元海真元）阴了花酒行者；花酒行者虽胜，却中了月影蛊，遁走时又强杀围攻家老，最终拖死在山壁秘洞中。活下来的家老颠倒黑白、篡改真相。
- **遗藏内容**（山壁秘洞中）：15 块元石 + 一只**酒虫** + 石壁上的**留影存声蛊**（记录真相的影像）+ 枯死的酒囊花蛊/饭袋草蛊残骸。
- **前世**：发现此洞的族中蛊师（三转）选择**禀告家族**，换来奖赏——因为独吞有被家族清洗的风险，且酒虫对他不值钱。
- **方源的选择**：独吞。他评估"影像可卖给其他山寨，打击古月信念，比家族奖赏更值钱"；但他留待后用（本阶段未卖）。

### 2. 酒虫（V1 最核心资源，AI 描写必守）
- 一转蛊虫，**体型如蚕宝宝、通体珍珠白光、胖乎乎的**。
- 以酒水为食，能凌空飞行（飞行时团成一团、像白汤圆），速度很快。
- 价值超过多数二转蛊；若作本命蛊，比月光蛊更好。
- **获得方式（过程本身就是剧情）**：方源在竹林用**青竹酒**（青茅山最浓郁的酒香）引诱酒虫 → 酒虫喝醉、飞行变慢 → 方源追踪到后山大瀑布分支下的巨石缝隙 → 钻入山壁秘洞，发现花酒行者遗骸与酒虫栖息在枯藤死根上。
- 捕捉关键：**它喝醉（青竹酒）才飞得慢、戒备才低**，硬追根本抓不到。
- **炼化**：酒虫意志顽强，普通炼化极难（方源丙等，正常要 11–16 块元石）。方源靠**春秋蝉的气息**碾压酒虫意志，瞬间炼成，几乎零成本。
- **功效**：把青铜真元**凝练提纯**，让一转初阶拥有中阶真元质量；稳步提升修为、无副作用。靠青竹酒喂养最经济。
- 方源炼化后把它藏于床头角落、平时不示人（防学堂检查）。

### 3. 春秋蝉（方源底牌，本阶段只露气息）
- 六转本命蛊（前世炼制），逆光阴/重生的媒介，**用一次即消耗**。
- 重生后虚弱至极，一用就是死亡；但它的**气息**仍能碾压一切一转蛊虫意志（炼化神辅助）。
- 方源对外绝不显露，藏在空窍里沉睡。AI 写方源身份时：**任何人都不该知道他身怀春秋蝉**，这是最大秘密。

### 4. 双亲遗产（舅父舅母线）
- 方源方正双亲因家族任务陨落，遗产被舅父舅母侵占。
- 前世方源花了两年才靠遗产修行到一转巅峰（被夺产误了进度）；这一世他**提前索回**。
- 索回的手段是族规硬条款（16 岁一转中阶）+ 借势 + 逼舅父舅母就范，不是暴力抢回。
- AI 写这段要记得：舅父舅母是"投资心态"，斗不过方源但会用族规、舆论、挑拨兄弟来使绊子。

### 5. 狼潮与三寨（V1 后半程大事件）
- 触发：电狼群因食物枯竭、大规模冲击山寨。
- **规模**：数千头电狼 + 30 多头豪电狼（牛犊大小、百狼王）+ 3 头**千兽王狂电狼**（象般巨大）+ 可能出现的**雷冠头狼**（八月末出现，青书牺牲才挡住）。
- 山寨守备：一转蛊师贴墙灌铁藤蛊/毒花蛊，二转上木梯/塔楼，塔楼驻家老压场，药堂治疗蛊师殿后。
- **方源的战法**：用白玉蛊探察敌情、拿捏时机，不硬拼。他一人之力不能挡狼潮，靠的是判断与算账。
- 白凝冰在狼潮中与熊力小组因"强取蛊"冲突（熊家表弟熊毡战死、蛊虫被白凝冰收藏），爆发内斗——这是 AI 容易忽略的"人与狼同时是威胁"的混乱局面。

### 6. 青茅山的"宿命结局"与出山
- 青茅山这条线的"原著名场面"是白凝冰四转自爆冰封全山——但那是**狼潮三年后**的事，本阶段玩家几乎不可能待到那一步。
- 方源在 V1 末尾处理完青茅山诸事（含与方正、家族的恩怨了结），**乘竹筏沿黄龙江出山**，进入 V2。出山是"走向各自的命运"的节点。

## 六、口吻与氛围参考（AI 叙事调性）

- **场景**：竹林月色、山溪瀑布、高脚吊楼灯火、青茅山春日/雨季。多用动作与环境写人，少空抒情。
- **人物对白**：短、利、不绕弯。方源冷而稳（"你退下罢"）；方正怯而忍（低头看脚尖）；白凝冰狂而冷（"在又如何？""就凭你？"）；舅父舅母市侩算计。
- **底层逻辑**：弱肉强食、资源为上、信息为王。家族不是温情窝，是利益场——但里面也有真情与牺牲（青书挡狼潮、前世那蛊师的忠诚禀告），别写成全员恶人。
- **不照抄**：禁止大段复制原著正文、禁止精确模仿原作者文风。本档案是"事实和口吻的锚"，不是"复制粘贴的素材"。

## 一、一句话时间轴（出山 → 定仙游北去）

1. **青茅山之战（V1→V2 的桥）**：仙鹤门天鹤上人南下收回血颅蛊真传，斩杀古月一代（血鬼尸僵尸老怪）。白凝冰**自爆北冥冰魄体**（十绝体）困住天鹤上人，方白破冰而出、斩青矛竹扎竹筏，顺黄龙江远遁。白凝冰化女身、修为回落三转、资质降为甲等九成——摆脱了"冰魄体越强越自毁"的宿命。
2. **黄龙江漂流**：方源一转初阶（正快速攀升），白凝冰三转女身为战力，二人一路躲追杀（百家百陌行拦截、六足鳄群）、收蛊虫（鳄力蛊、幽豹双耳敛息蛊、无足鸟等）。
3. **白骨山传承**（灰骨才子／骨肉上师）：螺旋骨洞机关、灰骨巨书，借百家兄妹"百生百花"开启"双子同心，三灵合一"，方源得**骨肉团圆蛊**（双修奇蛊，天底下唯一）并除掉兄妹。一夜从一转高阶升一转巅峰。
4. **加入商队**：方源化名"古月方正"、白凝冰女身同行。商心慈（本名张心慈，商家族长私生女，凡人无资质）登场。方源杀张柱（螺旋骨枪）、杀欧飞欧羊公，方白暴露三转巅峰修为。
5. **商家城**：南疆霸主商燕飞（五转高阶）出面消百家通缉、赐**紫荆令牌**（九等令牌最高，权限≈半个家老）。方源在此完成：演武场以三转巅峰战平四转巨开碑、借血颅蛊把资质篡改为**甲等**、20 岁晋升四转、帮商心慈铺少主之路（情报生意 10 天翻三倍）、勒索商睚眦 95 万、购三王传承入门蛊，随后离开。
6. **三王山（三王传承）**：三王=犬王／信王／爆王（三百年前王家寨被乌家剿灭后幸存的三个孩童，后成五转蛊师）。福地为上古力道蛊仙福地改造，红黄蓝三色光柱各需入门蛊（驭犬／纸鹤／爆蛋）。方源杀铁慕白（五转巅峰）得点金蛊、炼成第二空窍蛊（未完成，仙元不足）、与正魔群雄周旋。
7. **白凝冰背叛**：恢复男儿身、持冰刃与铁若男（铁家）合作，早在方源左前臂种下**定星蛊**。
8. **方源第三次催动春秋蝉**自爆重生，逆流光阴长河回到三王山更早时刻（王逍被踩脚下、云落天尸体旁）。此世他放弃第二空窍蛊，改炼**定仙游蛊**（四大移动仙蛊之一，可传送天下任何地方）。
9. **定仙游炼成**：神游蛊+碧空蛊（杀龙青天所得）+定星蛊（白凝冰所种）+萧芒的太古荣耀之光（天瀑光河），三更蛊加速三倍、百战不殆蛊保一次必成。绿光蝴蝶破茧而出，方源展翼去北原。

## 二、南疆地理与势力

### 黄龙江
- 南疆大河。青茅山有分脉支流，竹筏从支流汇入主河道**一日千里有余**。曾有一只五转吞江蟾顺主河道意外流落青茅山脚边。
- 方源逃亡主路线；江上、江畔多凶兽（六足鳄群、雄鳄王）。

### 白骨山（灰骨才子传承）
- 山体遍布**螺旋骨刺**，密布如枪尖者即"螺旋骨洞"——传承入口。机关：洞中一根**可以扭转的特殊骨刺**。
- 传承内：**灰骨巨书**（记载炼蛊秘方、传承之主生平与立传承缘由）、**奶泉眼**、骨枪蛊（一转）、螺旋骨枪蛊（二转）、肉白骨蛊（三转治疗）、肉笑蛊／肉囊秘阁，以及压轴的**骨肉团圆蛊**。
- 传承之主=**灰骨才子**（别称**骨肉上师**），本命蛊藏于尸骨脑壳，需拜祭磕三个响头后劈开方可得（方源照做，是"货真价实的响头"）。
- 开启传承另需"**双子同心，三灵合一**"机关——须以一对血亲（百生百花兄妹）开启。方源以此夺蛊后烧死兄妹。

### 匪猴山
- 商队必经地，猴王与蛊师**掰手腕**论通行（熊力／马力／兔力／龟力／鳄力蛊等兽力比拼）。

### 商家城（南疆霸主）
- 商家=南疆霸主家族。族长**商燕飞**（五转高阶，赤色长发、血色火焰，距巅峰一步之遥）。
- 城分**外城**与**第一至第五内城**；上下排布又分**美食区／赌石区／寄养区／风月区／斗蛊区**等。
- **寄养区**：蛊师蛊虫过多可寄养，依情况收费，寻常一转蛊每月约 80 元石。
- **通幽商铺**：商睚眦名下，曾垄断压价方源卖蛊的渠道（方源反手勒索）。
- **风雨楼**：魏央掌管的商家情报机构。

### 三王山（三王传承福地）
- 三王：**犬王／信王／爆王**。三百年前王家寨被世敌乌家剿灭，漏掉三个孩童——犬王（8 岁男）、信王（6 岁女）、爆王（5 岁男），流亡后各成五转蛊师，合建传承。
- 福地源自上古一位**力道蛊仙**，蛊仙死于劫难后执念化地灵=**霸龟**（巨龟）；地灵考验=炼成**第二空窍蛊**（力道蛊仙临终研发的秘方）。有缘人须"同他一般体会死亡"。
- 传承门：**红／黄／蓝三色光柱**，每道光柱只可轮流进入、每十轮难度暴涨。入门各需一只蛊：黄（犬王）→**一转驭犬蛊**；蓝（信王）→**纸鹤蛊**；红（爆王）→**爆蛋蛊**。方白为此提前大量收购这三只蛊。
- 三王传承的消息在卷中传遍南疆，"三位五转蛊师传承一齐出现"，引来正魔无数蛊师。

### 火炭山 / 三叉山
- **火炭山**：往三王山的必经之路，产火炭石，栖熔岩鳄群、千兽王。
- **三叉山**：原车家、左家交接之地，三王传承福地入口所在。铁慕白曾在此镇压大半年。

### 中洲仙鹤门（方正线，与南疆线并行）
- 仙鹤门：中洲十大门派之一，建于**飞鹤山**悬空三万丈的云海之巅，中洲最古老门派之一。
- 层级：外门→内门→精英→真传→长老→掌门→**太上长老**；三年小考入内门、八年中考入精英、十五年大考入真传；长老至少四转、掌门五转、太上长老六转甚至七转。
- 鹤风扬：太上长老，六转蛊师，号**鹤羽飞仙**。
- **天梯山**：中洲第一山，近百万丈，传承圣地。卷中**白狐仙子传承**现世（六转蛊仙，占据**狐仙福地**，荡魂山/粉红水晶山），引动许多蛊仙出世、天梯山被重重包围。中洲十大门派精英大比武，胜者可入狐仙传承。

## 三、境界与真元（南疆阶段用得到的那部分）

- 蛊师九大境界，每转分**初阶／中阶／高阶／巅峰**四个小境界。
- **真元色泽随转数变化**：
  - 一转 → **青铜真元**（初阶翠绿→中阶苍绿→高阶深绿→巅峰墨绿，元海俗称"青铜海/青铜元海"）
  - 二转 → **赤铁真元**
  - 三转 → **白银真元**（淡银／花银／亮银／雪银）
  - 四转 → **黄金真元**（亮金；经**九眼酒虫**提纯可至**精金真元**，等于高一个小境界的品质）
  - 五转 → **紫晶真元**（淡紫／嫣紫／深紫／晶紫）
- **资质档位**：丁等（2–3 成，止步一二转）、丙等（4–5 成，常止步二转，**方源原本即丙等四成四**）、乙等（6–7 成，可修三四转）、甲等（8–9 成，理论可修五转）、**十绝体**（十成圆满，几皆早夭）。
  - 本卷变化：**方源**以血颅蛊（需同血脉族人鲜血）把资质篡改为**甲等**；**白凝冰**自爆北冥冰魄体后资质回落**甲等九成**；**方正**为甲等。
- **蛊虫七大类**（原著明确归类）：一攻击、二防御、三治疗、四侦察、五存储、六移动、七修行。酒虫／四味酒虫／人兽葬生蛊／舍利蛊／天元宝莲／骨肉团圆蛊均属**修行类**。
- **四大移动仙蛊**（都是六转）：**入梦游**（进入他人梦境）、**逍遥游**（最擅长闪避）、**定仙游**（传送到天底下任何地方）、**酒神游**（最特殊，出自《人祖传》）。方源前世掌握逍遥游、定仙游两道秘方。

## 四、人物档案（南疆阶段）

### 方源（玩家可扮演）
- 出场一转初阶，卷末四转中阶（九眼酒虫提纯为精金真元品质）。**资质已由血颅蛊篡改为甲等**——他深知"甲等资质"能当最好的伪装（铁若男据此误认他是古月阴荒体）。
- 化名习惯：对外常用"**古月方正**"（借弟弟的名字）、又号"**小兽王方正**""黑白双煞"。
- 蛊虫本卷重点：春秋蝉（六转仙蛊，天下奇蛊第七，本命隐藏底牌）、酒虫系（酒虫→四味酒虫→**九眼酒虫**，本命，产/提纯真元）、天元宝莲（日产约五十元石，牵涉九转仙尊的来历）、血颅蛊（四转血海真传）、骨肉团圆蛊（双修）、血月蛊、螺旋骨枪蛊、幽豹双耳敛息蛊、无足鸟、鳄力蛊、全力以赴蛊、天蓬蛊、阴云/阳云蛊、古铜皮蛊/精铁骨蛊、金汤蛊、骨翼蛊、金霞蛊、点金蛊（五转，夺自铁慕白）、碧空蛊（五转，杀龙青天）、三更蛊、百战不殆蛊、神游蛊、定星蛊等。四转蛊阵容：苦力蛊、横冲直撞蛊、阴阳转身蛊·阳蛊、九眼酒虫、费力蛊、血颅蛊。
- 行事：比青茅山更狠——夺血颅蛊后**屠杀古月亲族**以血提升资质；为夺骨肉团圆蛊烧死百生百花兄妹；勒索商睚眦 95 万。目标依旧是永生，手段无所不用其极。
- 隐藏线：仙鹤门天鹤上人败于他后，布下"方正杀亲哥夺蛊"的后手——方源本卷尚不知情。

### 白凝冰（玩家可扮演）
- 青茅山一战后**自爆北冥冰魄体**（十绝体）困住天鹤上人，脱困后**转化女身**、修为回落三转、资质甲等九成——**不再受"越强越接近自毁"的宿命所困**（此世重大改变之一）。
- 女身容貌清丽、目光寒意四射，如冰雪仙子，明珠般的光辉；心高气傲、敢打敢拼（"那老东西若是追来，我们反身死战就是"），却肯听方源在生死关头指点（"我的战法还不细腻？"）。
- 与方源是彼此利用又最信任彼此实力的搭档，形成"便宜保镖"式默契；她的本命蛊白相仙蛇在青茅山战后主动飞走。
- **卷末背叛**：恢复男儿身、持冰刃与铁若男/铁家合作，早在方源左前臂种下**定星蛊**（蓝天八角钻石星屑）——这段背叛是卷尾的钩子，也是定仙游蛊的炼材来源。

### 商心慈（本名张心慈，玩家可扮演）
- 商家族长**商燕飞年轻时在外游历的私生女**，凡人、**没有修行资质**，商队副首领。善良到"从未见过这么好心的人"。
- 前世（方源记忆）：她继承商家、成商家族长，一生行善。
- 此世方源有意识地扶持她铺少主之路（情报生意 10 万本金 10 天翻到 30 万），把她当作可用的善面棋子。商燕飞溺爱她，曾不惜动用**人力胜天蛊**为她逆天改命；她能否获得资质、继承商家，本卷未定局（悬而未决）。

### 方正（方源孪生弟弟，玩家可扮演）
- 甲等资质。被天鹤上人**接引入中洲仙鹤门**收为弟子，数年修到**四转中阶精英弟子**、中考第一，驾驭上万铁喙飞鹤群。
- **黑暗真相**：天鹤上人收他另有目的——天鹤上人寿元耗尽，以一生积蓄+蛊虫换取**寄魂蚤**，计划死后借寄魂蚤督促方正**炼成至亲血虫、杀死亲哥哥方源、为仙鹤门夺回血颅蛊**。方正本人不知内情（还是"孩子"），是棋子。
- 天梯山十派大比武：只撑了六个回合败给凤金煌。

### 商燕飞（NPC，南疆霸主）
- 五转高阶，赤色长发、血焰浴身，距巅峰一步之遥；威严、有气量（给方白消通缉令、赐最高紫荆令牌）。
- 手握**血手印蛊**（血海真传），一直在**收集血海真传**；对方源手上的血颅蛊觊觎已久（方源视其为最后退路筹码）。
- 溺爱私生女商心慈。

### 铁若男（玩家可扮演）
- 铁家八少主之一，甲等资质，正直（受铁慕白点化"主持正义"）。
- 商家城带走铁刀苦、与方源结怨；三王山后期与白凝冰合作对方源，是卷尾正道的代表之一。

### 铁慕白（NPC）
- 铁家**上一代族长**，五转巅峰、晶紫真元，干瘦老人、看破名利。
- 蛊：**点金蛊**（五转，射中任何生灵化为纯金、生机尽灭）、金汤蛊（五转防御）。镇压三叉山大半年。
- 被巫鬼、骷魔（五转巅峰魔道）夹攻后，被方源所杀，点金蛊落入方源之手。

### 凤金煌（玩家可扮演）
- 天梯山十派大比武**第一人**，华贵辉煌、肌肤若雪、如天生翱翔的凤凰；方正只撑六回合。
- 化金光凤凰撞开朱红门楼，与萧七星、应生机等二三十位精英进入狐仙传承；卷内**申时两刻登顶、继承狐仙福地**（其梦翼仙蛊是 3 岁梦中所得）。
- **前世**（方源记忆）：被方源伙同魔道蛊仙攻荡魂山斩杀，正道为她作《凤金煌传》记三大奇遇。此世若玩家干预，这条线可改写。

### 天鹤上人 / 鹤风扬（NPC，仙鹤门线）
- 天鹤上人：仙鹤门资格极老的长老，南下夺血颅蛊真传失败（"被两个小辈戏耍镇压"），寿元将尽；回山后布下寄魂蚤+方正的后手，随即离世。
- 鹤风扬：太上长老，六转，号鹤羽飞仙，主导"夺回血颅蛊"的宗门意志。

- **商睚眦**：18 岁少主，耽于酒色、面庞消瘦双眼无神，怕丢掉少族长之位；想压方源的价反被勒索 80 万→95 万，后被流放捕奴大队三年。

- **百陌行**：百家老辣蛊师，黄龙江边率队拦截方白，被方源借"古月方正"身份忽悠。
- **李好／朱八／汤青／汤雄／李闲／薛三四**：演武场与三王山的各色对手（李好=移形蛊+背山蛤蟆；朱八=第四内城第八号防守反击；李闲=四转高阶东海大奸商持苍空蛊；薛三四=力修）。
- **龙青天／翼冲／孔日天／武神通／易火**：三叉山五位四转巅峰（龙青天持五转碧空蛊；武神通为武家奴道蛊师、骨瘦如柴、中碧空蛊毒圣手神医难根治；易火为商家五大家老、想改姓商投靠）。
- **巫鬼／骷魔**：五转巅峰魔道，乌七蛊（黑气污染、封禁六转以下蛊虫）／松骨蛊（方圆五十里骨骼软化）。
- **百岁童子**：180 多岁、还童蛊化成八九岁男童貌，爱认干儿女；被方源撕杀。
- **仇九**：杀人鬼医，本姓曾、小名阿牛、样貌极丑；影宗福地只剩师姐陈九；握有生死门消息；被方源以魂力奴隶（五转奴隶蛊）控制，最后奉上百战不殆蛊。
- **萧芒**：萧家五转，太光蛊（盗墓残蛊，每月三次）+天意蛊+空拳蛊→杀招太古光拳；又聚光蛊+江河日下蛊→杀招**天瀑光河**。
- **云落天／王逍／炎军**：三王山人物（云落天=云家少族长被白凝冰消灭；王逍=巫山之主五转被方源踩杀；炎军=炎家少族长、虚道传承、前世被风天语阻挡）。

## 五、核心剧情细节（最容易编错的"事实锚点"）

### 1. 青茅山之战的真实结局（V1→V2 的最大反转）
- 此世青茅山的覆灭**不是**"白凝冰四转自爆冰封全山"，而是：仙鹤门**天鹤上人**南下收回血颅蛊真传，与**古月一代**（血鬼尸僵尸老怪）血战（两败俱伤，古月一代最终伏诛），青茅山毁于这场老怪之战。
- **白凝冰自爆北冥冰魄体**（引爆自己的十绝体）困住天鹤上人，方白破冰而逃。白凝冰失去十绝体，但摆脱了必死宿命、化女身、修为落三转、资质甲等九成。
- 天鹤上人回山被鹤风扬训斥："你此次斩杀了门派叛徒，却并未寻回血颅蛊，反倒被两个小辈戏耍镇压。"→ 引出仙鹤门-方正线。

### 2. 血颅蛊真传与血海九道真传（本卷最深的暗线）
- **血海有九道真传**：血颅蛊、血手印蛊、血气蛊、血汗蛊、经血蛊、血影蛊、血战蛊，外加上古荒兽戾血龙蝠、六转仙蛊血神子。
- 已现世：**血颅蛊**（方源）、**血手印蛊**（商燕飞）、**戾血龙蝠**（宋紫星）。
- 血颅蛊=四转，血色骷髅头形、眼眶紫焰；能**篡改资质、为家族量产天才**；代价是需以**同血脉族人的鲜血**施法。古月家族曾靠它量产天才；青茅山被灭、族人凋零后对方源几乎无用（对商燕飞这种收集者却是至宝）。
- 方源夺真传后**当场屠杀古月亲族**，以血颅蛊之能把自己资质从丙等提到**甲等**。AI 写方源资质时必须按甲等写。

### 3. 骨肉团圆蛊 ≠"灌真元给别人"（最常见的错）
- 骨肉团圆蛊是**骨肉上师独创、天底下唯此一份**的**双修奇蛊**：和阴阳转身蛊一样是一对蛊，分别作用在两位蛊师身上，令二人**双修、修为齐头并进、事半功倍**。
- 方源评价：修行速度比酒虫还好，在前期（三转以后）以骇人速度暴涨；他志在必得，本卷靠它+白凝冰的修为一路飙升（三转巅峰、四转）。
- 双修时表现为"双掌贴背、灌输真元"——是双修的一种施为方式，不是"把别人灌成大境界"。

### 4. 白骨山传承的开启流程
- 螺旋骨洞 → 找到一根**可扭转的特殊骨刺**开启入口 → 洞内得**灰骨巨书**（正道传承书，记载秘方与灰骨才子生平）→ 机关"**双子同心，三灵合一**"需一对血亲（百家兄妹百生百花）开启 → 主蛊**骨肉团圆蛊**；另有奶泉眼、骨枪蛊（一转）、螺旋骨枪蛊（二转）、肉白骨蛊（三转治疗）等。
- 灰骨才子本命蛊在**尸骨脑壳**：灰骨巨书要求有缘人拜祭磕三个响头再劈开（方源照磕了"货真价实的响头"）。
- 方源得蛊后**烧死百生百花兄妹**灭口。

### 5. 百家通缉与商燕飞的紫荆令牌
- 方白因青茅山事变（夺血颅蛊等）被百家通缉。商燕飞出面：消掉通缉令+赐**紫荆令牌**（白赤橙黄绿青蓝紫九等令牌，黑石最低、紫荆最高，权限≈半个家老）。方源原本只估绿青蓝三色，低估了商燕飞的气量。
- 紫荆木所制、巴掌大、正面"商家"二字。→ 这张令牌后来被方源**当筹码/代价**使用（杀周全）。

### 6. 演武场：三转胜四转的真相
- 方源以**三转巅峰**对四转**巨开碑**（惯力蛊+象牙白甲蛊+龙行虎步蛊，杀招巨灵变三龙象力），战平后巨开碑**主动认输**——不是"越级秒杀"，是战平+对方权衡认输。
- 同一场戏的卧底：演武场擂台上的李然=**武然**（武家卧底，武姬娘娘授命、潜伏 8 年）。
- **自力更生蛊**（三转治疗，蟑螂形，4 万 5 千元石）：只能治疗自己、力量越强疗效越好；方源已有双猪一熊一鳄的兽力蛊组合。

### 7. 拍卖会与天元宝君莲秘方
- 拍卖会背景：沮家寨被大飓风摧毁、出**千年风柳**；**苦力蛊**被商睚眦 81 万元石买走（方源截胡/自炼）。
- **天元宝君莲秘方**：四转**铭心蛊**存储，方源从魏央处购得。

### 8. 商心慈少主之争（方源的"投资"）
- 方源帮商心慈做**情报生意**（演武场资料贩卖）：10 万元石本金、10 天翻三倍到 30 万。方源同期资产 240 多万。
- 他还收购**驭犬蛊／纸鹤蛊／爆蛋蛊**——当时商一帆等人以为他乱花钱，实际是三王传承的**入门蛊**（黄/蓝/红三光柱各需一只）。

### 9. 三王传承的入门规则（AI 必查）
- 三色光柱只能**轮流进入**、**每十轮难度暴涨**；进入标准：黄（犬王）→炼化一转驭犬蛊；蓝（信王）→持纸鹤蛊；红（爆王）→至少一只爆蛋蛊。
- 三王来历：三百年前王家寨被乌家剿灭，漏掉三个孩童（犬王 8 岁男、信王 6 岁女、爆王 5 岁男），日后皆成五转蛊师。
- 犬王传承（黄）：一心多用蛊、积累犬兽（菊花秋田犬／电文狗／刺猬犬／大电文狗=百兽王／铁甲狗／碧眼犬王／五岳犬阵=重泰·青华·烟嵩·恒光·星衡／嘤鸣犬皇）；韩不留被种奴隶蛊。
- 信王传承（蓝）：炼道传承；有毛民（《人祖传》：人祖双眼化为太日阳莽、古月阴荒）；第三十二关需杀毛民。
- 爆王传承（红）：红蛋人。

### 10. 第二空窍蛊：炼了，但没成（本卷最贵的"失败"）
- 第二空窍蛊（六转）秘方由福地原主力道蛊仙研发、临终传下；地灵霸龟考验=炼成它。秘方**无批注**，需**神游蛊／星火蛊／雪原蛊**等（**星火蛊、雪原蛊的具体作用【未知】**，别编）。
- 方源炼制：请地灵调动仙元，原计划耗九成、实耗八成三；炼蛊**五天五夜**几乎不眠不休；期间现"血田赤稻、三百岁为春"景象。
- 结果：**仙元不足、未炼成**（他后来转向定仙游）。卷末他没拿到第二空窍蛊——不要写成他已经有了。

### 11. 白凝冰的背叛（卷尾钩子，AI 别提前泄）
- 白凝冰在背叛前一直以**女身**示人；背叛时**恢复男儿身、手持冰刃**，与铁若男/铁家合作。
- 关键物证：**定星蛊**（蓝天八角钻石星屑）早已藏入方源**左前臂**——白凝冰用来定位/钳制方源的钉子，也是后来定仙游蛊的炼材之一。

### 12. 春秋蝉第三次催动（方源如何翻盘）
- 被围死之际，方源**自爆肉身、第三次催动春秋蝉**，意识逆光阴长河、扎进一滴水里重生——回到**三王山更早的时刻**：巫山之主王逍（五转）正被他踩在脚下求饶、云落天尸体躺在不远处。
- 重生后：杀王逍、夺蛊吞窍；兽力胎盘蛊连吞云落天+王逍空窍，资质到八成三；地灵霸龟再次震惊于春秋蝉（"这是六转仙蛊的气息……春秋蝉名列天下奇蛊第七！"）。
- 说明：**春秋蝉是消耗性底牌**，每次用都极危险；这次重生的时间点在本卷内（三王山），不是回到青茅山。

### 13. 定仙游蛊的炼制链（卷尾，方源的"改道"）
- 方源放弃第二空窍蛊，改炼**定仙游蛊**（六转，四大移动仙蛊之一，传送到天底下任何地方）。
- 主材：**神游蛊**+**碧空蛊**（青天碧空玉竹，五转，杀龙青天所得）+**定星蛊**（蓝天八角钻石星屑，白凝冰所种）+**太古荣耀之光**（萧芒以聚光蛊+太光蛊+江河日下蛊施展的杀招**天瀑光河**）。
- 辅助：**三更蛊**（五转、宙道、令个人时间**加速三倍**、消耗类，用一次即无）、**百战不殆蛊**（五转、炼蛊时**百分百合炼成功**、上古珍贵如今已绝迹，由仇九奉上）。
- 结局：金色蚕茧吸收太古荣耀之光，破茧飞出**绿光莹莹的蝴蝶（定仙游蛊）**；方源周身金光护体、逆流天瀑光河而上，**展翼去北原**。

### 14. 凤金煌与狐仙福地（中洲暗线）
- 凤金煌=十派大比武第一人，入狐仙传承后**申时两刻登顶**、继承狐仙福地；梦翼仙蛊是 3 岁梦中所得。
- **前世**：方源伙同魔道蛊仙攻荡魂山斩杀凤金煌，正道作《凤金煌传》。此世方源身处南疆、错失中洲机缘，曾自嘲"就算在中洲也不是十大门派弟子、参加不了天梯山角逐"。

## 六、口吻与氛围参考（AI 叙事调性）

- **场景**：黄龙江竹筏破浪、白骨山骨刺森森、商队驼铃与骡马、赌石场解石惊叫、演武场山呼、拍卖会灯火、三王山三色光柱冲天、福地青铜大殿、荡魂山粉红水晶山、仙鹤门云海悬空。多写动作与代价，少空抒情。
- **人物对白**：方源更冷更算（"小子古月方正，青茅山古月族少主，见过前辈"是当面扯谎）；白凝冰傲而敢战（"那老东西若是追来，我们反身死战就是"）、女身后多了"明珠般的清冷辉光"；商心慈纯善温软（与方源的算计互为对照）；商燕飞霸主气度（"就由我出面解释一番，将这通缉令消掉"）；铁若男正直热血；凤金煌高傲如凰；百陌行老辣多疑。
- **底层逻辑**：血与资源、宗门意志与家族兴衰、情报即武器。方源的每一步都不是热血翻身，是**算账**：救商心慈=投资、收购三只入门蛊=为三王传承铺路、留血颅蛊=退路筹码。
- **不照抄**：禁止大段复制原著正文、禁止精确模仿原作者文风。本档案是"事实和口吻的锚"，不是"复制粘贴的素材"。

## 七、常见出戏点自查（AI 写 V2 前先扫一眼）

- ❌ 把骨肉团圆蛊写成"灌输真元给别人、能冲大境界" → 是**双修一对蛊**，二人齐头并进。
- ❌ 白凝冰还是北冥冰魄体/压制修为作战 → 此世她**已自爆冰魄体**，女身、甲等九成、无自毁宿命。
- ❌ 青茅山覆灭=白凝冰四转自爆冰封全山 → 此世是天鹤上人 vs 古月一代 + 白凝冰自爆冰魄体困人。
- ❌ 方源还是丙等资质 → 已用血颅蛊篡改为**甲等**（且这是他的伪装筹码）。
- ❌ 三更蛊加速九倍 → 五转，**加速三倍**，消耗类，用一次即无。
- ❌ 百战不殆蛊随手可得 → 五转、上古珍贵、已绝迹，仇九奉上的。
- ❌ 三王传承随便进 → 红黄蓝三光柱各需**入门蛊**（驭犬／纸鹤／爆蛋），方白为此提前收购。
- ❌ 方源在商家城就炼成了第二空窍蛊 → **没炼成**（仙元不足、耗八成三），卷末改炼定仙游。
- ❌ 把白凝冰的背叛写成"早就翻脸" → 背叛发生在卷尾，之前是"最信任实力"的搭档关系。
- ❌ 春秋蝉重生=回到青茅山 → 第三次催动，重生点在三王山（王逍脚下），本卷内重新推演结局。
- ❌ 凤金煌的狐仙福地=三王传承同级 → 白狐仙子是**六转蛊仙完整传承**，比三王传承珍贵不知多少倍。
- ❌ 定仙游=炼成就能为所欲为 → 是空间移动仙蛊，传送"天底下任何地方"，使用仍有前提与代价（本卷只在卷尾初成）。
- ❌ 星火蛊/雪原蛊的作用乱编 → 第二空窍蛊秘方涉及，但**作用【未知】**，保持未知。
- ❌ 把血颅蛊写成普通一转蛊 → 四转血海真传、血色骷髅头、需同血脉族人血、量产天才。

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function textToHtml(t) {
  return esc(t).split(/\n{2,}/).map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
}
function appendMsg(role, content, cls) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "assistant" ? "ai" : role) + (cls ? " " + cls : "");
  if (role === "user") {
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = content;
    div.appendChild(b);
  } else if (role === "error") {
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = content;
    div.appendChild(b);
  } else {
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "◆ 模拟器";
    div.appendChild(label);
    const body = document.createElement("div");
    body.className = "body";
    body.innerHTML = aiBodyHtml(content);
    div.appendChild(body);
  }
  scene.appendChild(div);
  scrollBottom();
  return div;
}
function scrollBottom() {
  /* 瞬时贴底：关掉 smooth，避免流式刷新时反复触发平滑动画抽动 */
  const prev = scene.style.scrollBehavior;
  scene.style.scrollBehavior = "auto";
  scene.scrollTop = scene.scrollHeight;
  scene.style.scrollBehavior = prev;
}
/* 贴底跟随：贴底才跟随最新内容；往上回看旧剧情时不打扰 */

scene.addEventListener("scroll", () => {

});
function followBottom() { if (stickBottom) scrollBottom(); }

/* ---------- 行动选项 ---------- */
function extractActions(text) {
  const actions = [];
  const idx = text.lastIndexOf("【行动选项】");
  if (idx >= 0) {
    /* 先剥 markdown 加粗/行内代码/星号，避免 **1. 文本** 这类被正则漏掉 */
    const block = text.slice(idx).replace(/\*+|__+|`/g, "");
    /* 支持：1. / 1、 / 1． / - / • / · / ①②③ 等常见列表前缀 */
    const re = /^\s*(?:\d+\s*[.、．]|[-–—•·*]\s*|[①-⑨]\s*)\s*(.+?)\s*$/gm;
    let r;
    while ((r = re.exec(block)) !== null) {
      const t = r[1].trim();
      if (t && !/^【.+】$/.test(t)) actions.push(t);
    }
  }
  return actions.slice(0, 4);
}
function stripActions(text) {
  /* 按块剥除【行动选项】（含条目行，停在非条目行），不误删其后可能出现的其他块（如【状态快照】） */
  return stripBlock(text, "行动选项").replace(/\s+$/, "");
}

/* 显示用文本：剥掉所有机读/协议块。history 里保留 AI 原文（刷新后底部行动选项靠它提取），渲染时才剥 */
function stripProtocol(text) {
  let t = stripActions(text);       // 【行动选项】
  t = stripSnapshot(t);             // 【状态快照】及之后
  t = stripBlock(t, "参考行动");     // 兼容旧对话：历史里可能残留【参考行动】块，剥掉不再渲染
  return t;
}

function renderActions() {
  actionsEl.innerHTML = "";
  /* AI 推演期间给占位条，避免底部空白像「选项消失」 */
  if (busy) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "act-toggle";
    b.disabled = true;
    b.style.opacity = ".55";
    b.innerHTML = '<span class="at-label">🧭 世界推演中…</span>';
    actionsEl.appendChild(b);
    return;
  }
  if (state.phase === "start" || state.phase === "time") {
    const g = document.createElement("div");
    g.className = "grp";
    g.textContent = state.phase === "start" ? "开始你的蛊世界之旅：" : "继续完成开局：";
    actionsEl.appendChild(g);
    const b = document.createElement("button");
    b.className = "act-btn";
    b.innerHTML = '<span class="act-ic">🧭</span><span>打开开局向导</span>';
    b.addEventListener("click", openWizard);
    actionsEl.appendChild(b);
  } else {
    const raw = lastRawAi || ((state.history.filter(m => m.role === "assistant").pop() || {}).content || "");
    const acts = extractActions(raw);
    /* 兜底行动：有 AI 选项时是快捷工具，没选项时按剧情智能兜底 */
    const fallback = acts.length ? utilityActions() : smartFallbackActions(raw);
    /* 行动选项卡永不消失：AI 的【行动选项】优先；没有就用兜底行动填进去。
       折叠条（默认收起，不挡剧情）点开展示按钮，是唯一行动入口 */
    const actionBtns = acts.length ? acts : fallback;
    if (actionBtns.length) actionsEl.appendChild(actToggle(actionBtns));
    if (acts.length && fallback.length) actionsEl.appendChild(moreToggle(fallback));
  }
}

/* 折叠的兜底行动：「更多行动」默认收起，点开展开，不挤占行动选项卡 */
function moreToggle(actions) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "more-toggle";
  btn.setAttribute("aria-expanded", "false");
  btn.innerHTML = '<span>更多行动</span><span class="mt-arrow">▸</span>';
  const box = document.createElement("div");
  box.className = "more-box";
  box.hidden = true;
  for (const a of actions) box.appendChild(makeBtn(a, { fromBtn: true }));
  btn.addEventListener("click", () => {
    const open = box.hidden;
    box.hidden = !open;
    btn.classList.toggle("open", open);
    btn.querySelector(".mt-arrow").textContent = open ? "▾" : "▸";
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  const wrap = document.createElement("div");
  wrap.className = "more-wrap";
  wrap.appendChild(btn);
  wrap.appendChild(box);
  return wrap;
}

/* 行动选项卡折叠器：AI 的【行动选项】折叠成一条金色细条「🧭 行动选项（N）」，
   默认收起不挡剧情，点开才显示选项按钮，是唯一行动入口 */
function actToggle(acts) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "act-toggle";
  btn.setAttribute("aria-expanded", "false");
  btn.innerHTML = '<span class="at-label">🧭 行动选项</span><span class="at-count">' + acts.length + '</span><span class="at-arrow">▸</span>';
  const box = document.createElement("div");
  box.className = "act-box";
  box.hidden = true;
  for (const a of acts) box.appendChild(makeBtn(a, { fromBtn: true }));
  btn.addEventListener("click", () => {
    const open = box.hidden;
    box.hidden = !open;
    btn.classList.toggle("open", open);
    btn.querySelector(".at-arrow").textContent = open ? "▾" : "▸";
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  const wrap = document.createElement("div");
  wrap.className = "act-wrap";
  wrap.appendChild(btn);
  wrap.appendChild(box);
  return wrap;
}

/* 快捷工具：从账本状态给出不依赖剧情、永远可用的行动 */
function utilityActions() {
  const acts = [];
  if (ledger.gu.length || ledger.materials.length) acts.push("查看随身物品");
  const wounded = ledger.wounds && ledger.wounds !== "无" && ledger.wounds !== "";
  if (wounded) acts.push("找地方休整疗伤");
  else if (ledger.zhenMax > 0 && ledger.zhenCur < ledger.zhenMax * 0.3) acts.push("打坐恢复真元");
  acts.push("继续探索");
  return acts.slice(0, 4);
}

/* 兜底按钮生成：AI 没给【行动选项】时，按剧情线索和账本状态智能给出下一步，贴合当前场景 */
function smartFallbackActions(lastText) {
  const t = lastText || "";
  const acts = [];
  /* 剧情线索启发式：从上一回合正文里找「可去的地方 / 可接触的人」 */
  const placeHint = /前往|来到|远处|方向|寨|城|山|坊|楼|洞|府|谷|河|林|路|店|场|宫|崖|殿/.test(t);
  const personHint = /他|她|老者|少年|女子|汉子|守卫|护卫|头领|店主|姑娘|兄弟|长老|村民|商队/.test(t);
  const talkHint = /说|道|问|打听|消息|传闻|风声|叫他|找她/.test(t);
  if (placeHint && acts.length < 3) acts.push("循着线索前往查看");
  if ((personHint || talkHint) && acts.length < 3) acts.push("主动上前打听");
  /* 追加账本工具，去重，上限 4 个 */
  for (const a of utilityActions()) if (acts.length < 4 && !acts.includes(a)) acts.push(a);
  if (!acts.length) acts.push("继续探索");
  return acts.slice(0, 4);
}

/* ============================================================
   状态引擎：本地管账（记账 / 校验 / 渲染 / 回填）
   AI 每回合输出【状态快照】，本地解析、硬校验后更新面板。
   AI 是唯一结算者，本地只记账，不做世界结算。
   ============================================================ */
const LS_LEDGER = "gzr_v2_ledger";

const EMPTY_LEDGER = {
  time: "", location: "", name: "", identity: "",
  realm: "", zhenCur: 0, zhenMax: 0, yuan: 0,
  qiCur: 0, qiMax: 0,
  gu: [], materials: [], wounds: "", fame: "",
  visited: []   // 本地轨迹：去过的地点（不在快照协议内，本地累积）
};

let ledger = loadLedger();
function loadLedger() {
  try {
    const raw = localStorage.getItem(LS_LEDGER);
    if (raw) {
      const l = JSON.parse(raw);
      if (l && typeof l === "object") return Object.assign({}, EMPTY_LEDGER, l);
    }
  } catch (e) {}
  return Object.assign({}, EMPTY_LEDGER);
}
function saveLedger() { try { localStorage.setItem(LS_LEDGER, JSON.stringify(ledger)); } catch (e) {} }
function resetLedger() { ledger = Object.assign({}, EMPTY_LEDGER); saveLedger(); renderLedger(); renderTrail(); renderHand(); }
function ledgerHasData() {
  return !!(ledger.name || ledger.realm || ledger.location || ledger.time || ledger.gu.length || ledger.yuan);
}

/* 从 AI 回复提取【状态快照】并解析为对象；找不到或解析失败返回 null */
function parseSnapshot(text) {
  const idx = text.lastIndexOf("【状态快照】");
  if (idx < 0) return null;
  let body = text.slice(idx + "【状态快照】".length).trim();
  body = body.replace(/^```(?:json)?\s*/i, "").replace(/\s*```\s*$/, "").trim();
  const b = body.indexOf("{");
  const e = body.lastIndexOf("}");
  if (b < 0 || e <= b) return null;
  try { return JSON.parse(body.slice(b, e + 1)); } catch (err) { return null; }
}

/* 硬校验 + 合并：非法字段保留旧值，返回被拒绝字段列表 + 前后差值 */
function applySnapshot(snap) {
  const cur = Object.assign({}, ledger);
  const prevZhen = cur.zhenCur;
  const prevYuan = cur.yuan;
  const prevGu = (cur.gu || []).slice();
  const prevMat = (cur.materials || []).slice();
  const prevWound = cur.wounds;
  const rejected = [];
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const isStr = (v) => typeof v === "string";
  const isArr = (v) => Array.isArray(v);

  if (isStr(snap["时间"])) cur.time = snap["时间"];
  if (isStr(snap["地点"])) {
    cur.location = snap["地点"];
    if (snap["地点"].trim() && snap["地点"] !== ledger.location && !cur.visited.includes(snap["地点"])) {
      cur.visited = cur.visited.concat([snap["地点"]]);   // 本地轨迹累积；concat 新建数组，不污染 EMPTY_LEDGER 的共享引用
    }
  }
  if (isStr(snap["姓名"])) cur.name = snap["姓名"];
  if (isStr(snap["身份"])) cur.identity = snap["身份"];
  if (isStr(snap["修为"])) cur.realm = snap["修为"];
  if (isStr(snap["伤势"])) cur.wounds = snap["伤势"];
  if (isStr(snap["名声"])) cur.fame = snap["名声"];
  if (isArr(snap["蛊虫"])) cur.gu = snap["蛊虫"].map(String);
  if (isArr(snap["材料"])) cur.materials = snap["材料"].map(String);

  if (snap["真元"] && typeof snap["真元"] === "object") {
    const c = snap["真元"]["当前"], m = snap["真元"]["上限"];
    if (isNum(c) && isNum(m) && m >= 0 && c >= 0 && c <= m) { cur.zhenCur = c; cur.zhenMax = m; }
    else rejected.push("真元");
  }
  if (snap["气血"] && typeof snap["气血"] === "object") {
    const c = snap["气血"]["当前"], m = snap["气血"]["上限"];
    if (isNum(c) && isNum(m) && m >= 0 && c >= 0 && c <= m) { cur.qiCur = c; cur.qiMax = m; }
    else rejected.push("气血");
  }
  if (snap["元石"] !== undefined) {
    if (isNum(snap["元石"]) && snap["元石"] >= 0) cur.yuan = snap["元石"];
    else rejected.push("元石");
  }
  return {
    ledger: cur, rejected,
    delta: {
      zhenDelta: prevZhen - cur.zhenCur,
      yuanDelta: prevYuan - cur.yuan,
      guAdded: cur.gu.filter((g) => !prevGu.includes(g)),
      guRemoved: prevGu.filter((g) => !cur.gu.includes(g)),
      matAdded: cur.materials.filter((m) => !prevMat.includes(m)),
      matRemoved: prevMat.filter((m) => !cur.materials.includes(m)),
      woundsChanged: cur.wounds !== prevWound
    }
  };
}

/* 从显示文本中剥掉【状态快照】块（机读格式，不给玩家看）。
   整块标题行一起切（含行首编号，如「⑥【状态快照】」），避免留下悬空编号字符 */
function stripSnapshot(text) {
  const idx = text.lastIndexOf("【状态快照】");
  if (idx < 0) return text.replace(/\s+$/, "");
  let cut = text.lastIndexOf("\n", idx);
  return (cut >= 0 ? text.slice(0, cut + 1) : "").replace(/\s+$/, "");
}

/* ---------- 回合块解析与分块渲染 ---------- */
/* 变化条目按首 emoji 着色 */
const CHG_EMOJI = { "🟢": "gain", "🔴": "loss", "🔵": "info", "🟡": "warn", "🟣": "rel" };

/* 条目判定：emoji 前缀 / 编号 / 短横线。正文段落、空行、下一个块标题都不是条目 */
function looksLikeItem(t) {
  const s = t.trim();
  if (!s) return false;
  if (CHG_EMOJI[Array.from(s)[0]]) return true;
  if (/^[0-9０-９一二三四五六七八九十]+[.、．:：]/.test(s)) return true;
  if (/^[-–—•·]\s*/.test(s)) return true;
  return false;
}

/* 提取某块标题下的逐行条目（块标题行首独立；条目形如 emoji/编号/短横线开头；到非条目行结束） */
function extractBlock(text, key) {
  const items = [];
  let inBlock = false;
  for (const line of text.split("\n")) {
    const t = line.trim();
    if (!inBlock) {
      if (t.includes("【" + key + "】")) inBlock = true;
    } else if (looksLikeItem(t)) {
      items.push(t);
    } else {
      break;
    }
  }
  return items;
}

/* 从正文里剥掉某块（标题行 + 其下条目行），剩余正文渲染用；非条目行（含下一个块标题）停止剥除 */
function stripBlock(text, key) {
  const out = [];
  let skip = false;
  for (const line of text.split("\n")) {
    const t = line.trim();
    if (t.includes("【" + key + "】")) { skip = true; continue; }
    if (skip) {
      if (looksLikeItem(t)) continue;
      skip = false;
    }
    out.push(line);
  }
  return out.join("\n");
}
function chgClass(line) {
  const first = Array.from(line.trim())[0] || "";
  return CHG_EMOJI[first] || "other";
}

/* AI 正文 → 分块 HTML：变化色块 + 局面列表 + 行动卡 + 剩余正文；找不到块时整段当正文 */
function aiBodyHtml(content) {
  const chgs = extractBlock(content, "本回合变化");
  const sits = extractBlock(content, "当前局面");
  /* 剥协议块（【行动选项】【状态快照】及旧历史残留的【参考行动】），正文只展示玩家可见内容；
     行动选项由底部行动选项卡渲染，正文不再重复 */
  let body = stripProtocol(content);
  if (chgs.length) body = stripBlock(body, "本回合变化");
  if (sits.length) body = stripBlock(body, "当前局面");
  let html = textToHtml(body);
  if (chgs.length) {
    html += '<div class="chg-card">' + chgs.map((c) =>
      '<div class="chg-item ' + chgClass(c) + '">' + esc(c) + '</div>').join("") + '</div>';
  }
  if (sits.length) {
    html += '<div class="sit-card"><div class="sit-title">📌 当前局面</div>' +
      sits.map((s) => '<div class="sit-item">' + esc(s) + '</div>').join("") + '</div>';
  }
  return html;
}

/* 真元变化飘字（本地对比前后差值，开局首次不飘）；label 如 "真元" */

  floatMsg((delta > 0 ? "−" : "+") + Math.abs(delta) + (label ? " " + label : ""), delta < 0);
}

/* ---------- 观感工具：音效 / 屏幕震动 / 元素高亮 ---------- */
const Sound = (() => {
  let ctx = null, muted = false;
  function ensure() {
    if (muted) return null;
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === "suspended") { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }
  function tone(freq, dur, type, vol, when) {
    const c = ensure(); if (!c) return;
    try {
      const t0 = c.currentTime + (when || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol || .08, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + .03);
    } catch (e) {}
  }
  return {
    toggle() { muted = !muted; return muted; },
    isMuted() { return muted; },
    click()  { tone(560, .05, "triangle", .05); },
    send()   { tone(340, .08, "sine", .07); tone(500, .07, "sine", .05, .05); },
    gain()   { tone(660, .1, "sine", .08); tone(880, .12, "sine", .05, .07); },
    loss()   { tone(300, .16, "sawtooth", .05); },
    hit()    { tone(150, .12, "sawtooth", .09); tone(95, .16, "square", .06); },
    error()  { tone(220, .18, "sawtooth", .06); tone(170, .22, "sawtooth", .05, .12); },
    ding()   { tone(520, .08, "sine", .06); tone(700, .1, "sine", .05, .08); }
  };
})();

/* 给元素加短暂高亮（获得绿闪/损失红闪）；id 或元素均可 */

}

/* ---------- 持久化 ---------- */
function saveState() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

/* ---------- API 调用 ---------- */
function apiUrl() { return cfg.base.replace(/\/+$/, "") + "/chat/completions"; }

async function callAPI(messages, onDelta) {
  const res = await fetch(apiUrl(), {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + cfg.key
    },
    body: JSON.stringify({ model: cfg.model, messages, stream: cfg.stream })
  });
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.text()).slice(0, 300); } catch (e) {}
    throw new Error("HTTP " + res.status + "：" + detail);
  }
  if (!cfg.stream) {
    const j = await res.json();
    onDelta(j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : "");
    return;
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      let line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!line.startsWith("data:")) continue;
      const data = line.slice(5).trim();
      if (data === "[DONE]") return;
      try {
        const j = JSON.parse(data);
        const d = j.choices && j.choices[0] && j.choices[0].delta;
        if (d && d.content) onDelta(d.content);
      } catch (e) {}
    }
  }
}

/* 跨卷自动跟随：扫描历史中最近一条 AI 快照的「世界阶段」字段（如 "V2 南疆"），
   合法（V1–V6）就更新 state.stage，下次请求自动注入对应档案。
   漏填/填错/旧存档则保持当前 stage，不报错——保证从 V1 一路玩到 V6 不断档 */
function syncStageFromHistory() {
  for (let i = state.history.length - 1; i >= 0; i--) {
    const m = state.history[i];
    if (m.role !== "assistant") continue;
    const snap = parseSnapshot(m.content);
    if (!snap) continue;
    const st = String(snap["世界阶段"] || "").match(/V[1-6]/);
    if (st) { state.stage = st[0]; return; }
  }
}

/* 当前阶段的原著档案（无 stage 或无对应档案时返回空串，不注入） */
function currentArchive() {
  if (state.stage && ARCHIVES[state.stage]) {
    return "【原著剧情基线 · " + state.stage + " 阶段】（自动加载，写剧情时以此为准，档案未写的按世界观推断、拿不准保持【未知】）\n\n" + ARCHIVES[state.stage];
  }
  return "";
}

/* ---------- 发送 ---------- */
function send(text, opts) {
  text = String(text || "").trim();
  if (!text || busy) return;
  if (state.phase === "start") state.phase = "time";
  else if (state.phase === "time") state.phase = "game";
  updateBadge();
  /* 观感：战斗类行动给重反馈（震屏+重音），普通行动轻反馈 */
  if (/(战|攻|杀|打|击|追|偷袭|抵挡|猎|夺|抢|斗|围攻)/.test(text)) { Sound.hit(); shakeScreen(); }
  else Sound.send();
  flashBtn(btnSend);
  state.history.push({ role: "user", content: text });
  saveState();
  busy = true;
  btnSend.disabled = true;
  freeInput.value = "";
  renderAll();   // busy=true → 行动区显示「世界推演中…」占位，不让底部空白
  /* 乐观反馈：按钮发起的行动立即给确认，AI 流式回来后替换 */
  const waitText = (opts && opts.fromBtn) ? "🧭 正在行动：" + text + " …" : "… 世界在推演中";
  const wait = document.createElement("div");
  wait.className = "msg ai";
  wait.innerHTML = '<div class="label">◆ 模拟器</div><div class="body">' + esc(waitText) + '</div>';
  scene.appendChild(wait);
  followBottom();

  syncStageFromHistory();   // 跨卷自动跟随：按最近快照的「世界阶段」刷新档案阶段后再注入
  const messages = [{ role: "system", content: SYSTEM_PROMPT }];
  const arc = currentArchive();
  if (arc) messages.push({ role: "system", content: arc });
  if (ledgerHasData()) messages.push({ role: "system", content: ledgerContext() });
  for (const m of state.history) messages.push(m);
  const aiMsg = { role: "assistant", content: "" };
  state.history.push(aiMsg);
  saveState();

  let bodyEl = null, aiDiv = null;
  callAPI(messages, (delta) => {
    aiMsg.content += delta;
    if (!bodyEl) {
      if (wait.parentNode) wait.parentNode.removeChild(wait);
      aiDiv = appendMsg("assistant", aiMsg.content);
      bodyEl = aiDiv.querySelector(".body");
    } else {
      bodyEl.innerHTML = textToHtml(stripProtocol(aiMsg.content));
      followBottom();
    }
  }).then(() => {
    if (!bodyEl && wait.parentNode) wait.parentNode.removeChild(wait);
    const snap = parseSnapshot(aiMsg.content);
    if (snap) {
      const hadData = ledgerHasData();
      const r = applySnapshot(snap);
      const d = r.delta || {};
      if (hadData) {
        if (d.zhenDelta) { floatNum(d.zhenDelta, "真元"); d.zhenDelta > 0 ? Sound.loss() : Sound.gain(); }
        if (d.yuanDelta) { floatNum(d.yuanDelta, "元石"); flashEl("cpYuan", d.yuanDelta < 0); d.yuanDelta < 0 ? Sound.gain() : Sound.loss(); }
        d.guAdded.forEach((g) => floatMsg("🐛 获得 " + g, true));
        d.guRemoved.forEach((g) => floatMsg("🐛 失去 " + g, false));
        d.matAdded.forEach((m) => floatMsg("🧰 获得 " + m, true));
        d.matRemoved.forEach((m) => floatMsg("🧰 失去 " + m, false));
        if (d.guAdded.length || d.guRemoved.length) flashEl("cpGu", d.guAdded.length > 0);
        if (d.matAdded.length || d.matRemoved.length) flashEl("cpMat", d.matAdded.length > 0);
        if (d.woundsChanged) flashEl("cpWound", false);
      }
      ledger = r.ledger;
      saveLedger();
      renderLedger();
      renderTrail();
      renderHand();
    }
    lastRawAi = aiMsg.content;   // 保留原始输出供底部选项提取（renderActions 用）
    if (aiDiv && aiDiv.parentNode) aiDiv.parentNode.removeChild(aiDiv);
    /* history 保留 AI 原文（含【行动选项】【状态快照】），刷新/重开后底部行动选项仍可提取；
       appendMsg → aiBodyHtml 渲染时剥掉协议块，玩家看到的是干净正文 */
    appendMsg("assistant", aiMsg.content, "enter");
    Sound.ding();
    busy = false;
    btnSend.disabled = false;
    saveState();
    renderAll();
  }).catch((err) => {
    if (wait.parentNode) wait.parentNode.removeChild(wait);
    state.history.pop();
    busy = false;
    btnSend.disabled = false;
    Sound.error();
    appendMsg("error", "调用失败：" + err.message + "\n\n如果提示是 CORS / 网络错误，试着在 VSCode 里右键本文件 → Open with Live Server 再打开；确认 API Key 和地址填对了。");
    saveState();
    renderAll();
  });
}

/* ---------- 导出 / 导入 ---------- */
function exportText() {
  const parts = [];
  for (const m of state.history) {
    if (m.role === "user") parts.push("玩家：" + m.content);
    else parts.push("模拟器：\n" + m.content);
  }
  const txt = parts.join("\n\n------------------------\n\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => alert("已复制到剪贴板，粘贴到任何地方保存即可。")).catch(() => fallbackCopy(txt));
  } else {
    fallbackCopy(txt);
  }
}
function fallbackCopy(txt) {
  const ta = document.createElement("textarea");
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); alert("已复制到剪贴板（兜底方式）。"); } catch (e) { prompt("复制失败，手动复制以下内容：", txt); }
  document.body.removeChild(ta);
}

/* ---------- 移动端软键盘高度 → --kkb（footer 抬升 / 弹层收缩共用） ---------- */
(function () {
  const vv = window.visualViewport;
  if (!vv) return;
  const root = document.documentElement;
  const editing = () => document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  const apply = () => {
    const kb = editing() ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
    root.style.setProperty("--kkb", kb ? kb + "px" : "0px");
  };
  document.addEventListener("focusin", apply);
  document.addEventListener("focusout", apply);
  vv.addEventListener("resize", apply);
  vv.addEventListener("scroll", apply);
  apply();
})();

/* 折叠按钮通用逻辑：去过 / 随身 共用（手机默认收起，点开/收起记本机） */
function wireBarToggle(btn, content, lsKey) {
  if (!btn || !content) return;
  const arrow = btn.querySelector(".bt-arrow");
  const apply = (c) => {
    content.classList.toggle("open", !c);
    if (arrow) arrow.textContent = c ? "▸" : "▾";
  };
  btn.addEventListener("click", () => {
    const c = content.classList.contains("open");
    apply(c);
    try { localStorage.setItem(lsKey, c ? "1" : "0"); } catch (err) {}
  });
  let saved = null;
  try { saved = localStorage.getItem(lsKey); } catch (err) {}
  /* 同上：折叠只属于窄屏，电脑端永远展开、无视历史记录 */
  apply(window.matchMedia("(max-width: 760px)").matches ? saved !== "0" : false);
}

  cfg.base = document.getElementById("cfgBase").value.trim() || "https://api.deepseek.com";
  cfg.key = document.getElementById("cfgKey").value.trim();
  cfg.model = document.getElementById("cfgModel").value.trim() || "deepseek-chat";
  cfg.stream = document.getElementById("cfgStream").checked;
  saveCfg();
  document.getElementById("settingsOverlay").classList.remove("show");
  alert("设置已保存。");
});

/* ---------- 初始化 ---------- */
(function init() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.history)) {
        state = s;
        updateBadge();
        renderLedger();
        renderTrail();
        renderHand();
        renderAll();
        if (state.phase === "start" || state.phase === "time") openWizard();
        return;
      }
    }
  } catch (e) {}
  state = { phase: "start", history: [] };
  saveState();
  renderLedger();
  renderTrail();
  renderHand();
  updateBadge();
  showWelcome();
  openWizard();
})();
</script>
</body>
</html>
